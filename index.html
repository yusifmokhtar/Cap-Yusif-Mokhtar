<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YUSIF MOKHTAR | Football Coach & Kids Football Development</title>

<meta name="description" content="YUSIF MOKHTAR - Football Coach, Kids Football Development Specialist and Physical Education Professional from Egypt.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#07111f;
    --bg2:#0b1728;
    --card:#101f33;
    --card2:#13263d;

    --primary:#38bdf8;
    --secondary:#22d3ee;
    --accent:#60a5fa;

    --white:#ffffff;
    --text:#d8e5f2;
    --muted:#91a5ba;

    --border:rgba(255,255,255,.09);

    --shadow:0 20px 60px rgba(0,0,0,.25);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'DM Sans',sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(56,189,248,.10),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(34,211,238,.08),transparent 30%),
        var(--bg);
    color:var(--text);
    line-height:1.7;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

section{
    padding:100px 0;
}

.section-label{
    color:var(--primary);
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:13px;
    font-weight:700;
    margin-bottom:12px;
}

.section-title{
    font-family:'Syne',sans-serif;
    font-size:clamp(35px,5vw,58px);
    color:var(--white);
    line-height:1.1;
    margin-bottom:20px;
}

.section-text{
    color:var(--muted);
    max-width:700px;
}

/* NAVBAR */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(7,17,31,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

.nav-container{
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:'Syne',sans-serif;
    font-weight:800;
    font-size:21px;
    color:white;
}

.logo span{
    color:var(--primary);
}

.nav-links{
    display:flex;
    gap:28px;
    list-style:none;
}

.nav-links a{
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--primary);
}

.menu-btn{
    display:none;
    font-size:27px;
    cursor:pointer;
}

/* HERO */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding-top:100px;
    position:relative;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:70px;
    align-items:center;
}

.hero-tag{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:8px 15px;
    border:1px solid rgba(56,189,248,.25);
    background:rgba(56,189,248,.07);
    border-radius:30px;
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    margin-bottom:25px;
}

.hero-tag::before{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

.hero h1{
    font-family:'Syne',sans-serif;
    font-size:clamp(55px,8vw,100px);
    line-height:.95;
    color:white;
    margin-bottom:25px;
}

.hero h1 span{
    color:var(--primary);
}

.hero-subtitle{
    font-size:19px;
    color:var(--muted);
    max-width:650px;
    margin-bottom:35px;
}

.hero-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 25px;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    transition:.3s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.btn-primary{
    background:var(--primary);
    color:#03111d;
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(56,189,248,.25);
}

.btn-outline{
    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    color:white;
}

.btn-outline:hover{
    border-color:var(--primary);
    color:var(--primary);
}

/* HERO CARD */

.profile-card{
    background:
        linear-gradient(145deg,rgba(56,189,248,.12),rgba(255,255,255,.02)),
        var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px;
    box-shadow:var(--shadow);
}

.profile-photo{
    width:150px;
    height:150px;
    margin:0 auto 25px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#061321;
    font-family:'Syne',sans-serif;
    font-size:45px;
    font-weight:800;
}

.profile-card h3{
    text-align:center;
    font-family:'Syne',sans-serif;
    color:white;
    font-size:23px;
}

.profile-role{
    text-align:center;
    color:var(--primary);
    margin:5px 0 25px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.stat{
    text-align:center;
    padding:15px 8px;
    background:rgba(255,255,255,.04);
    border-radius:12px;
}

.stat strong{
    display:block;
    color:white;
    font-size:22px;
}

.stat span{
    color:var(--muted);
    font-size:11px;
}

/* ABOUT */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-card{
    padding:30px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
}

.about-card h3{
    color:white;
    font-family:'Syne',sans-serif;
    font-size:25px;
    margin-bottom:15px;
}

.about-list{
    list-style:none;
    margin-top:20px;
}

.about-list li{
    padding:11px 0;
    border-bottom:1px solid var(--border);
    color:var(--muted);
}

.about-list li strong{
    color:white;
}

/* SKILLS */

.skills-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-top:45px;
}

.skill-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
    transition:.3s;
}

.skill-card:hover{
    transform:translateY(-6px);
    border-color:rgba(56,189,248,.4);
}

.skill-icon{
    font-size:30px;
    margin-bottom:15px;
}

.skill-card h3{
    color:white;
    font-size:17px;
    margin-bottom:8px;
}

.skill-card p{
    color:var(--muted);
    font-size:13px;
}

/* EXPERIENCE */

.timeline{
    margin-top:50px;
    position:relative;
}

.timeline::before{
    content:"";
    position:absolute;
    left:8px;
    top:0;
    bottom:0;
    width:2px;
    background:linear-gradient(var(--primary),transparent);
}

.timeline-item{
    position:relative;
    padding-left:40px;
    margin-bottom:45px;
}

.timeline-dot{
    position:absolute;
    left:0;
    top:7px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--primary);
    box-shadow:0 0 20px rgba(56,189,248,.5);
}

.timeline-date{
    color:var(--primary);
    font-size:13px;
    font-weight:700;
    margin-bottom:5px;
}

.timeline-item h3{
    color:white;
    font-family:'Syne',sans-serif;
    font-size:25px;
}

.timeline-item h4{
    color:#9bb0c5;
    font-size:15px;
    margin-bottom:10px;
}

.timeline-item p{
    color:var(--muted);
    max-width:750px;
}

/* PROGRAMS */

.program-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:45px;
}

.program{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:28px;
    transition:.3s;
}

.program:hover{
    transform:translateY(-5px);
    border-color:rgba(56,189,248,.4);
}

.program-number{
    color:var(--primary);
    font-family:'Syne',sans-serif;
    font-size:14px;
    margin-bottom:15px;
}

.program h3{
    color:white;
    margin-bottom:10px;
    font-family:'Syne',sans-serif;
}

.program p{
    color:var(--muted);
    font-size:14px;
}

/* KIDS ARENA */

.feature-section{
    background:
        linear-gradient(135deg,rgba(56,189,248,.08),rgba(34,211,238,.02));
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
}

.feature-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.feature-box{
    padding:35px;
    border-radius:25px;
    background:var(--card);
    border:1px solid var(--border);
}

.feature-box h3{
    font-family:'Syne',sans-serif;
    color:white;
    font-size:32px;
    margin-bottom:15px;
}

.feature-box p{
    color:var(--muted);
    margin-bottom:20px;
}

.feature-tags{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.feature-tags span{
    padding:8px 12px;
    border-radius:20px;
    background:rgba(56,189,248,.08);
    color:var(--primary);
    font-size:12px;
    border:1px solid rgba(56,189,248,.15);
}

/* EDUCATION */

.education-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:45px;
}

.edu-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px;
}

.edu-card h3{
    color:white;
    font-family:'Syne',sans-serif;
    font-size:22px;
    margin-bottom:8px;
}

.edu-card .institution{
    color:var(--primary);
    margin-bottom:15px;
}

.edu-card p{
    color:var(--muted);
}

/* CERTIFICATES */

.certificates{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.certificate{
    padding:12px 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    color:#c7d6e5;
    font-size:13px;
}

/* CONTACT */

.contact-section{
    text-align:center;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin:45px 0;
}

.contact-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
}

.contact-card .icon{
    font-size:28px;
    margin-bottom:10px;
}

.contact-card h3{
    color:white;
    margin-bottom:5px;
}

.contact-card p,
.contact-card a{
    color:var(--muted);
    font-size:14px;
}

.contact-card a:hover{
    color:var(--primary);
}

/* FOOTER */

footer{
    border-top:1px solid var(--border);
    padding:30px 0;
    text-align:center;
    color:var(--muted);
    font-size:13px;
}

/* REVEAL */

.reveal{
    opacity:0;
    transform:translateY(25px);
    transition:opacity .8s ease,transform .8s ease;
}

.reveal.active{
    opacity:1;
    transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:900px){

    .hero-grid,
    .about-grid,
    .feature-grid{
        grid-template-columns:1fr;
    }

    .skills-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .program-grid{
        grid-template-columns:1fr 1fr;
    }

    .education-grid{
        grid-template-columns:1fr;
    }

    .contact-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:700px){

    section{
        padding:75px 0;
    }

    .nav-links{
        position:absolute;
        top:75px;
        left:0;
        width:100%;
        display:none;
        flex-direction:column;
        background:#07111f;
        padding:25px;
        border-bottom:1px solid var(--border);
    }

    .nav-links.active{
        display:flex;
    }

    .menu-btn{
        display:block;
    }

    .hero{
        min-height:auto;
        padding-top:130px;
        padding-bottom:80px;
    }

    .hero h1{
        font-size:58px;
    }

    .hero-subtitle{
        font-size:16px;
    }

    .skills-grid,
    .program-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .profile-card{
        max-width:400px;
        margin:auto;
    }

}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:var(--bg);
}

::-webkit-scrollbar-thumb{
    background:#21415c;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:var(--primary);
}

</style>
</head>
